<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setting</title>
    <link rel="stylesheet" href="../css files/Profile.css">
</head>

<body>

    <div class="container">
        <aside class="sidebar" id="sidebar">

            <div class="profile">
                <div class="avtar" id="avtar">DU</div>
                <div>
                    <h3 id="userName">Demo User</h3>
                    <p id="userEmail">demo@webtech.practice</p>
                </div>
            </div>

            <h4>DASHBOARD</h4>
            <ul>
                <li class="menu-item" onclick="window.location.href='../html files/Overview.html'">
                    Overview
                </li>

                <li class="menu-item active" onclick="window.location.href='../html files/Profile.html'">
                    Profile Settings
                </li>

                <li class="menu-item" onclick="window.location.href='../html files/Security.html'">
                    Security
                </li>

                <li class="menu-item" onclick="window.location.href='../html files/Notification.html'">
                    Notification
                </li>
            </ul>

            <h4>QUICK ACTION</h4>
            <ul>
                <li class="menu-item help-support" onclick="window.location.href='../html files/HelpSupport.html'">
                    Help & Support
                </li>
            </ul>

            <div class="logout">
                <h4>ACCOUNT</h4>
                <a href="../html files/Signin.html">
                    Sign Out
                </a>
            </div>

        </aside>

        <main class="main">

            <header class="navbar">
                <h2 id="welcomeText">WebTech Practice Dashboard</h2>
            </header>

            <section class="first">

                <h2>Profile Setting</h2>

                <!-- FORM START -->
                <form id="profileForm">

                    <h4>Personal Information</h4>

                    <div class="fill">

                        <div class="label">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" placeholder="Demo User">
                        </div>

                        <div class="label">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob">
                        </div>

                        <div class="label">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="demo@email.com">
                        </div>

                        <div class="label">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" placeholder="+91 9876543210">
                        </div>

                    </div>

                    <h3>Address Information</h3>

                    <div class="full">
                        <label for="Street">Street Address</label>
                        <textarea id="Street" rows="4"
                            placeholder="Enter Your Complete Address"></textarea>
                    </div>

                    <div class="fill">

                        <div class="label">
                            <label for="pin">Pin Code</label>
                            <input type="number" id="pin" placeholder="123456">
                        </div>

                        <div class="label">
                            <label for="city">City</label>
                            <input type="text" id="city" placeholder="Ranchi">
                        </div>

                        <div class="label">
                            <label for="Country">Country</label>
                            <input type="text" id="Country" placeholder="India">
                        </div>

                        <div class="label">
                            <label for="git">GitHub Profile</label>
                            <input type="url" id="git"
                                placeholder="https://github.com/username">
                        </div>

                    </div>

                    <div class="but">
                        <button type="reset" class="cancel">Cancel Changes</button>
                        <button type="submit" class="save">Save Changes</button>
                    </div>

                </form>
                <!-- FORM END -->

            </section>

        </main>
    </div>

    <script src="../js files/Profile.js"></script>

</body>

</html>
