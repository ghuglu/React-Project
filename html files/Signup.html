<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="../css files/Signup.css">
</head>
<body>
    <div class="container">
        <h1>Create your account</h1>
        <p class="subtitle">Sign up to access the practice dashboard. </p>

        <form id="signupForm">

            <div class="row">
                <div class="input-box">
                    <label>First Name:</label>
                    <input type="text" id="fname" placeholder="Enter First Name">
                    <small id="fnameError" class="error"></small>
                </div>

                <div class="input-box">
                    <label>Last Name:</label>
                    <input type="text" id="lname" placeholder="Enter Last Name">
                    <small id="lnameError" class="error"></small>
                </div>
                </div>

                <div class="input-box full">
                    <label>Email Address:</label>
                    <input type="email" id="email" placeholder="Enter your email Address">   
                    <small id="emailError" class="error"></small>         
                </div>

                <div class="row">
                    <div class="input-box">
                        <label>Password:</label>
                        <input type="password" id="password" placeholder="Enter Password">
                        <small id="passwordError" class="error"></small>
                     </div>
                        
                
                    <div class="input-box">
                        <label>Confirm Password:</label>
                        <input type="password" id="confirm" placeholder="confirm Password">
                        <small id="confirmError" class="error"></small>
                    </div>
                    </div>

                <p class="note">Use at least 8 characters,with letter & number
                   </p>
            
                
                 <div class="check">
                    <input type="checkbox" id="agree">
                    <label for="agree">I agree to the Terms</label>
                    <small  id="agreeError" class="error"></small>
                </div>

                <button type="submit" id="createBtn" disabled>Create Account</button>

                <p class="login">
                    Already Have account?
                 <a href="../html files/Signin.html">Sign In</a>
                </p>

        </form>
    </div>

    <script src="../js files/Signup.js"></script>

    </body>
    </html>
